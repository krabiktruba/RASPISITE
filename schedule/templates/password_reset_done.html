{% extends "main.html" %}

{% block content %}
<div class="auth-page">
    <section class="auth-card">
        <h1>Проверьте почту</h1>
        <p class="auth-lead">
            Если такая почта есть на сайте, мы отправили на неё письмо со ссылкой.
            Ссылка действует час. Письмо может прийти не сразу, загляните и в «Спам».
        </p>

        <p class="auth-switch">
            <a href="{% url 'password_reset' %}">Запросить ещё раз</a> ·
            <a href="{% url 'login' %}">Ко входу</a>
        </p>
    </section>
</div>
{% endblock %}
